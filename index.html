<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Vintage Phone Games</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='2' width='18' height='28' rx='4' fill='%23222a36'/%3E%3Crect x='10' y='5' width='12' height='12' fill='%2300ff88'/%3E%3Crect x='11' y='20' width='10' height='6' rx='2' fill='%23596275'/%3E%3C/svg%3E" />
  <style>
    /* Everything is sized in "u" so the whole phone scales to fit the window */
    :root { --u: min(0.88vh, 2.1vw, 8px); }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: radial-gradient(circle at 50% 30%, #2a2a2a, #0b0b0b);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ---- Phone body -------------------------------------------------------
       Skin colours, radii and widths are CSS custom properties on .phone.
       The values below are the LINICRO 1000 "Graphite Brick" defaults.
       SkinManager sets the same properties inline when a skin is applied. */
    .phone {
      --phone-width: 44;
      --phone-pad-top: 2.5;
      --phone-pad-side: 3;
      --phone-pad-bottom: 3;
      --phone-radius-tl: 7;
      --phone-radius-tr: 7;
      --phone-radius-br: 9;
      --phone-radius-bl: 9;
      --phone-bg: linear-gradient(160deg, #3b4250, #1e222a 60%, #15181e);
      --phone-highlight: rgba(255, 255, 255, 0.15);
      --phone-inset-dark: rgba(0, 0, 0, 0.5);
      --phone-drop: rgba(0, 0, 0, 0.7);
      --phone-glow: transparent;
      --phone-shine: linear-gradient(180deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 28%, transparent 50%);

      --brand-color: #9aa4b2;
      --brand-tracking: 0.6;
      --brand-size: 1.8;

      --speaker-width: 10;
      --speaker-height: 1;
      --speaker-bg: repeating-linear-gradient(90deg, #0a0b0d 0 calc(var(--u) * 0.6), #2a2f38 calc(var(--u) * 0.6) calc(var(--u) * 1));

      --screen-wrap-bg: #0b0c0e;
      --screen-wrap-pad: 1.5;
      --screen-wrap-radius: 2;
      --lcd-bg: #000;

      --softbar-bg: #0d1a12;
      --softbar-border: #1d3a28;
      --softbar-fg: #00ff88;

      --key-fg: #d8dee8;
      --key-bg: linear-gradient(#4b5363, #2c323d);
      --key-radius: 1.2;
      --key-shadow: #12151a;
      --key-sub-fg: #8c96a5;

      --call-bg: linear-gradient(#3f8f55, #24603a);
      --end-bg: linear-gradient(#a8443f, #6e2724);
      --call-fg: #e8ffe8;
      --end-fg: #f0d8d8;
      --call-radius: 2.2;

      --dpad-size: 15;
      --dpad-radius: 50%;
      --dpad-bg: radial-gradient(circle at 40% 35%, #4a5262, #232831);
      --dir-fg: #aab3c0;
      --dir-active: #00ff88;

      --ok-bg: linear-gradient(#5a6375, #333a46);
      --ok-fg: #d8dee8;
      --ok-active: #00ff88;
      --ok-size: 5.6;

      position: relative;
      isolation: isolate;
      width: calc(var(--u) * var(--phone-width));
      padding: calc(var(--u) * var(--phone-pad-top)) calc(var(--u) * var(--phone-pad-side)) calc(var(--u) * var(--phone-pad-bottom));
      background: var(--phone-bg);
      border-radius: calc(var(--u) * var(--phone-radius-tl)) calc(var(--u) * var(--phone-radius-tr)) calc(var(--u) * var(--phone-radius-br)) calc(var(--u) * var(--phone-radius-bl));
      box-shadow:
        inset 0 calc(var(--u) * 0.4) 0 var(--phone-highlight),
        inset 0 calc(var(--u) * -0.6) 0 var(--phone-inset-dark),
        0 calc(var(--u) * 2) calc(var(--u) * 5) var(--phone-drop),
        0 0 calc(var(--u) * 4) var(--phone-glow);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: calc(var(--u) * 1.6);
    }
    /* Glossy shell highlight sits behind the controls so it doesn't wash out the LCD */
    .phone::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      z-index: 0;
      background: var(--phone-shine);
    }
    .phone > * { position: relative; z-index: 1; }

    .speaker {
      width: calc(var(--u) * var(--speaker-width));
      height: calc(var(--u) * var(--speaker-height));
      border-radius: 99px;
      background: var(--speaker-bg);
    }
    .brand {
      color: var(--brand-color);
      font-size: calc(var(--u) * var(--brand-size));
      letter-spacing: calc(var(--u) * var(--brand-tracking));
      font-weight: bold;
      margin-top: calc(var(--u) * -0.6);
    }

    /* ---- Screen ---- */
    .screen-wrap {
      background: var(--screen-wrap-bg);
      padding: calc(var(--u) * var(--screen-wrap-pad));
      border-radius: calc(var(--u) * var(--screen-wrap-radius));
      box-shadow: inset 0 0 0 calc(var(--u) * 0.4) #000, inset 0 0 calc(var(--u) * 2) rgba(0, 0, 0, 0.9);
    }
    .screen { position: relative; width: calc(var(--u) * 36); }
    #game-container {
      position: relative;
      width: calc(var(--u) * 36);
      height: calc(var(--u) * 48);
      background: var(--lcd-bg);
      overflow: hidden;
      transition: filter 400ms;
    }

    /* ---- Living phone: status bar above the LCD (same colours as the soft-key bar) ---- */
    .statusbar {
      display: flex;
      align-items: center;
      gap: calc(var(--u) * 1);
      height: calc(var(--u) * 2.8);
      padding: 0 calc(var(--u) * 0.9);
      background: var(--softbar-bg);
      border-bottom: 1px solid var(--softbar-border);
      color: var(--softbar-fg);
      font-size: calc(var(--u) * 1.6);
      font-weight: bold;
      line-height: 1;
      transition: filter 400ms;
    }
    .statusbar svg { display: block; height: calc(var(--u) * 1.6); width: auto; fill: currentColor; }
    .sb-signal .bar.off { opacity: 0.22; }
    .sb-mail { display: flex; align-items: center; gap: calc(var(--u) * 0.4); opacity: 0.3; }
    .sb-mail svg { fill: none; stroke: currentColor; stroke-width: 1.3; }
    .sb-mail.has { opacity: 1; animation: sb-blink 1.2s steps(2, start) infinite; }
    @keyframes sb-blink { to { opacity: 0.35; } }
    .sb-clock { margin-left: auto; letter-spacing: calc(var(--u) * 0.1); }
    .sb-batt { display: flex; align-items: center; gap: calc(var(--u) * 0.3); }
    .sb-batt .cell.off { opacity: 0.18; }
    .sb-batt .plug { display: none; }
    .sb-batt.mains .plug { display: block; }
    .sb-batt.low .cells, .sb-batt.empty .cells { animation: sb-blink 0.8s steps(2, start) infinite; }
    .sb-batt.charging .bolt { display: block; }
    .sb-batt .bolt { display: none; }

    /* Toast for incoming texts / battery (never blocks input) */
    .phone-toast {
      position: absolute;
      left: 6%;
      right: 6%;
      top: calc(var(--u) * 3.4);
      z-index: 5;
      padding: calc(var(--u) * 0.7) calc(var(--u) * 1);
      background: var(--softbar-fg);
      color: var(--softbar-bg);
      font-size: calc(var(--u) * 1.6);
      font-weight: bold;
      text-align: center;
      border-radius: calc(var(--u) * 0.5);
      box-shadow: 0 calc(var(--u) * 0.3) calc(var(--u) * 1) rgba(0, 0, 0, 0.5);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
      opacity: 0;
      transform: translateY(calc(var(--u) * -1));
      transition: opacity 180ms, transform 180ms;
    }
    .phone-toast.show { opacity: 1; transform: translateY(0); }

    /* LCD effects driven by phone perks / battery */
    .lcd-ghost {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      image-rendering: pixelated;
      mix-blend-mode: lighten;
      opacity: 0;
      transition: opacity 200ms;
    }
    .lcd-ghost.on { opacity: 0.6; }
    .screen.lcd-sun #game-container { filter: contrast(1.12) saturate(1.2) brightness(1.06); }
    .screen.lcd-dim #game-container, .screen.lcd-dim .statusbar { filter: brightness(0.45); }
    .screen.lcd-glitch #game-container { animation: lcd-glitch 450ms steps(6) 1; }
    @keyframes lcd-glitch {
      0%   { transform: translate(0, 0); filter: none; }
      20%  { transform: translate(calc(var(--u) * 0.6), 0); filter: hue-rotate(90deg) saturate(2); }
      40%  { transform: translate(calc(var(--u) * -0.5), calc(var(--u) * 0.2)); filter: invert(0.15) hue-rotate(200deg); }
      60%  { transform: translate(calc(var(--u) * 0.3), 0); filter: hue-rotate(300deg); }
      80%  { transform: translate(calc(var(--u) * -0.2), 0); filter: none; }
      100% { transform: translate(0, 0); filter: none; }
    }

    /* Incoming text: the whole phone buzzes */
    .phone.buzz { animation: phone-buzz 480ms linear 1; }
    @keyframes phone-buzz {
      0%, 100% { transform: translate(0, 0) rotate(0); }
      10%, 50%, 90% { transform: translate(calc(var(--u) * -0.4), 0) rotate(-0.6deg); }
      30%, 70% { transform: translate(calc(var(--u) * 0.4), 0) rotate(0.6deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .phone.buzz, .screen.lcd-glitch #game-container { animation: none; }
    }
    /* LCD scanlines */
    .screen::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.18) 0 1px, transparent 1px 3px);
    }
    .softbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: calc(var(--u) * 3.6);
      padding: 0 calc(var(--u) * 1);
      background: var(--softbar-bg);
      border-top: 1px solid var(--softbar-border);
      color: var(--softbar-fg);
      font-size: calc(var(--u) * 1.9);
      font-weight: bold;
    }

    /* ---- Buttons ---- */
    .key {
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      touch-action: none;
      border: none;
      color: var(--key-fg);
      background: var(--key-bg);
      border-radius: calc(var(--u) * var(--key-radius));
      box-shadow: 0 calc(var(--u) * 0.5) 0 var(--key-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transition: transform 60ms, box-shadow 60ms, filter 60ms;
    }
    .key.pressed, .key:active {
      transform: translateY(calc(var(--u) * 0.4));
      box-shadow: 0 calc(var(--u) * 0.1) 0 var(--key-shadow);
      filter: brightness(1.35);
    }

    .controls {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }
    .side {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: calc(var(--u) * 1.6);
    }
    .soft {
      width: calc(var(--u) * 9);
      height: calc(var(--u) * 3.6);
      font-size: calc(var(--u) * 2);
    }
    .call, .end {
      width: calc(var(--u) * 8);
      height: calc(var(--u) * 4.4);
      border-radius: calc(var(--u) * var(--call-radius));
      font-size: calc(var(--u) * 2.2);
    }
    .call { background: var(--call-bg); color: var(--call-fg); }
    .end { background: var(--end-bg); color: var(--end-fg); }

    /* D-pad */
    .dpad {
      position: relative;
      width: calc(var(--u) * var(--dpad-size));
      height: calc(var(--u) * var(--dpad-size));
      border-radius: var(--dpad-radius);
      background: var(--dpad-bg);
      box-shadow: inset 0 calc(var(--u) * 0.3) 0 rgba(255, 255, 255, 0.15), 0 calc(var(--u) * 0.6) calc(var(--u) * 1) rgba(0, 0, 0, 0.6);
    }
    .dir {
      position: absolute;
      width: calc(var(--u) * 5);
      height: calc(var(--u) * 5);
      border: none;
      background: transparent;
      color: var(--dir-fg);
      font-size: calc(var(--u) * 2.2);
      cursor: pointer;
      touch-action: none;
      font-family: inherit;
    }
    .dir.pressed, .dir:active { color: var(--dir-active); }
    .dir.up    { top: 0; left: 50%; transform: translateX(-50%); }
    .dir.down  { bottom: 0; left: 50%; transform: translateX(-50%); }
    .dir.left  { left: 0; top: 50%; transform: translateY(-50%); }
    .dir.right { right: 0; top: 50%; transform: translateY(-50%); }
    .ok {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: calc(var(--u) * var(--ok-size));
      height: calc(var(--u) * var(--ok-size));
      border-radius: var(--dpad-radius);
      border: none;
      cursor: pointer;
      touch-action: none;
      font-family: inherit;
      font-weight: bold;
      font-size: calc(var(--u) * 1.7);
      color: var(--ok-fg);
      background: var(--ok-bg);
      box-shadow: 0 calc(var(--u) * 0.4) 0 var(--key-shadow);
    }
    .ok.pressed, .ok:active { filter: brightness(1.4); color: var(--ok-active); }

    /* Number keypad */
    .keypad {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: calc(var(--u) * 1.2) calc(var(--u) * 1.6);
      padding: 0 calc(var(--u) * 1);
    }
    .keypad .key {
      height: calc(var(--u) * 4.6);
      font-size: calc(var(--u) * 2.4);
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: calc(var(--u) * 0.6);
    }
    .keypad .key small { font-size: calc(var(--u) * 1.2); color: var(--key-sub-fg); }

    .hint {
      position: fixed;
      bottom: 6px;
      width: 100%;
      text-align: center;
      font-size: 11px;
      color: #555;
    }
    @media (max-width: 600px) { .hint { display: none; } }

    /* Desktop (mouse + keyboard): hide the digit keypad so the game screen can
       be much bigger. Touch devices keep the full keypad. The keyboard still
       handles 0-9 on desktop. */
    @media (hover: hover) and (pointer: fine) {
      :root { --u: min(1.12vh, 2.1vw, 13px); }
      .keypad { display: none; }
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="speaker"></div>
    <div class="brand">LINICRO</div>

    <div class="screen-wrap">
      <div class="screen">
        <div class="statusbar" aria-hidden="true">
          <span class="sb-signal" id="sb-signal"><svg viewBox="0 0 14 10"><rect class="bar" x="0" y="8" width="2" height="2"/><rect class="bar" x="3" y="6" width="2" height="4"/><rect class="bar" x="6" y="4" width="2" height="6"/><rect class="bar" x="9" y="2" width="2" height="8"/><rect class="bar" x="12" y="0" width="2" height="10"/></svg></span>
          <span class="sb-mail" id="sb-mail"><svg viewBox="0 0 13 9"><rect x="0.65" y="0.65" width="11.7" height="7.7"/><path d="M0.9 1 L6.5 5.2 L12.1 1"/></svg><b id="sb-unread"></b></span>
          <span class="sb-clock" id="sb-clock">--:--</span>
          <span class="sb-batt" id="sb-batt"><svg class="plug" viewBox="0 0 8 10"><rect x="1.5" y="0" width="1.2" height="3"/><rect x="5.3" y="0" width="1.2" height="3"/><rect x="0" y="3" width="8" height="3.5" rx="1"/><rect x="3.3" y="6.5" width="1.4" height="3.5"/></svg><svg class="bolt" viewBox="0 0 6 10"><path d="M4 0 L0 5.6 H2.6 L1.6 10 L6 4 H3.3 Z"/></svg><svg class="cells" viewBox="0 0 22 10"><path d="M0 0 H20 V3 H22 V7 H20 V10 H0 Z M1 1 V9 H19 V1 Z" fill-rule="evenodd"/><rect class="cell" x="2" y="2" width="3" height="6"/><rect class="cell" x="5.5" y="2" width="3" height="6"/><rect class="cell" x="9" y="2" width="3" height="6"/><rect class="cell" x="12.5" y="2" width="3" height="6"/><rect class="cell" x="16" y="2" width="2.5" height="6"/></svg></span>
        </div>
        <div id="game-container"></div>
        <div class="phone-toast" id="phone-toast" role="status" aria-live="polite"></div>
        <div class="softbar"><span id="soft-left"></span><span id="soft-right"></span></div>
      </div>
    </div>

    <div class="controls">
      <div class="side">
        <button class="key soft" data-key="softLeft" aria-label="Left soft key">―</button>
        <button class="key call" data-key="ok" aria-label="Call / OK">✆</button>
      </div>
      <div class="dpad">
        <button class="dir up" data-key="up" aria-label="Up">▲</button>
        <button class="dir left" data-key="left" aria-label="Left">◀</button>
        <button class="dir right" data-key="right" aria-label="Right">▶</button>
        <button class="dir down" data-key="down" aria-label="Down">▼</button>
        <button class="ok" data-key="ok" aria-label="OK">OK</button>
      </div>
      <div class="side">
        <button class="key soft" data-key="softRight" aria-label="Right soft key">―</button>
        <button class="key end" data-key="back" aria-label="Back (hold to power off / on)">C</button>
      </div>
    </div>

    <div class="keypad">
      <button class="key" data-key="d1" data-digit="1">1<small>.,</small></button>
      <button class="key" data-key="d2" data-digit="2">2<small>abc</small></button>
      <button class="key" data-key="d3" data-digit="3">3<small>def</small></button>
      <button class="key" data-key="d4" data-digit="4">4<small>ghi</small></button>
      <button class="key" data-key="d5" data-digit="5">5<small>jkl</small></button>
      <button class="key" data-key="d6" data-digit="6">6<small>mno</small></button>
      <button class="key" data-key="d7" data-digit="7">7<small>pqrs</small></button>
      <button class="key" data-key="d8" data-digit="8">8<small>tuv</small></button>
      <button class="key" data-key="d9" data-digit="9">9<small>wxyz</small></button>
      <button class="key" data-key="star" data-digit="*">*</button>
      <button class="key" data-key="d0" data-digit="0">0<small>␣</small></button>
      <button class="key" data-key="hash" data-digit="#">#</button>
    </div>
  </div>

  <div class="hint">Keyboard: arrows/WASD move · Enter/Space OK · Q / E soft keys · Esc back · hold Esc/End power · P / # pause · M sound · N music · 0-9 keypad · 8 settings · * code · ** word</div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
