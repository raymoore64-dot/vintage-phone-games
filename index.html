<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Vintage Phone Games</title>
  <style>
    /* Everything is sized in "u" so the whole phone scales to fit the window */
    :root { --u: min(0.88vh, 2.1vw, 8px); }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: radial-gradient(circle at 50% 30%, #2a2a2a, #0b0b0b);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ---- Phone body ---- */
    .phone {
      width: calc(var(--u) * 44);
      padding: calc(var(--u) * 2.5) calc(var(--u) * 3) calc(var(--u) * 3);
      background: linear-gradient(160deg, #3b4250, #1e222a 60%, #15181e);
      border-radius: calc(var(--u) * 7) calc(var(--u) * 7) calc(var(--u) * 9) calc(var(--u) * 9);
      box-shadow:
        inset 0 calc(var(--u) * 0.4) 0 rgba(255, 255, 255, 0.15),
        inset 0 calc(var(--u) * -0.6) 0 rgba(0, 0, 0, 0.5),
        0 calc(var(--u) * 2) calc(var(--u) * 5) rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: calc(var(--u) * 1.6);
    }
    .speaker {
      width: calc(var(--u) * 10);
      height: calc(var(--u) * 1);
      border-radius: 99px;
      background: repeating-linear-gradient(90deg, #0a0b0d 0 calc(var(--u) * 0.6), #2a2f38 calc(var(--u) * 0.6) calc(var(--u) * 1));
    }
    .brand {
      color: #9aa4b2;
      font-size: calc(var(--u) * 1.8);
      letter-spacing: calc(var(--u) * 0.6);
      font-weight: bold;
      margin-top: calc(var(--u) * -0.6);
    }

    /* ---- Screen ---- */
    .screen-wrap {
      background: #0b0c0e;
      padding: calc(var(--u) * 1.5);
      border-radius: calc(var(--u) * 2);
      box-shadow: inset 0 0 0 calc(var(--u) * 0.4) #000, inset 0 0 calc(var(--u) * 2) rgba(0, 0, 0, 0.9);
    }
    .screen { position: relative; width: calc(var(--u) * 36); }
    #game-container {
      width: calc(var(--u) * 36);
      height: calc(var(--u) * 48);
      background: #000;
      overflow: hidden;
    }
    /* LCD scanlines */
    .screen::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.18) 0 1px, transparent 1px 3px);
    }
    .softbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: calc(var(--u) * 3.6);
      padding: 0 calc(var(--u) * 1);
      background: #0d1a12;
      border-top: 1px solid #1d3a28;
      color: #00ff88;
      font-size: calc(var(--u) * 1.9);
      font-weight: bold;
    }

    /* ---- Buttons ---- */
    .key {
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      touch-action: none;
      border: none;
      color: #d8dee8;
      background: linear-gradient(#4b5363, #2c323d);
      border-radius: calc(var(--u) * 1.2);
      box-shadow: 0 calc(var(--u) * 0.5) 0 #12151a, inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transition: transform 60ms, box-shadow 60ms, filter 60ms;
    }
    .key.pressed, .key:active {
      transform: translateY(calc(var(--u) * 0.4));
      box-shadow: 0 calc(var(--u) * 0.1) 0 #12151a;
      filter: brightness(1.35);
    }

    .controls {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }
    .side {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: calc(var(--u) * 1.6);
    }
    .soft {
      width: calc(var(--u) * 9);
      height: calc(var(--u) * 3.6);
      font-size: calc(var(--u) * 2);
    }
    .call, .end {
      width: calc(var(--u) * 8);
      height: calc(var(--u) * 4.4);
      border-radius: calc(var(--u) * 2.2);
      font-size: calc(var(--u) * 2.2);
    }
    .call { background: linear-gradient(#3f8f55, #24603a); }
    .end { background: linear-gradient(#a8443f, #6e2724); }

    /* D-pad */
    .dpad {
      position: relative;
      width: calc(var(--u) * 15);
      height: calc(var(--u) * 15);
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #4a5262, #232831);
      box-shadow: inset 0 calc(var(--u) * 0.3) 0 rgba(255, 255, 255, 0.15), 0 calc(var(--u) * 0.6) calc(var(--u) * 1) rgba(0, 0, 0, 0.6);
    }
    .dir {
      position: absolute;
      width: calc(var(--u) * 5);
      height: calc(var(--u) * 5);
      border: none;
      background: transparent;
      color: #aab3c0;
      font-size: calc(var(--u) * 2.2);
      cursor: pointer;
      touch-action: none;
      font-family: inherit;
    }
    .dir.pressed, .dir:active { color: #00ff88; }
    .dir.up    { top: 0; left: 50%; transform: translateX(-50%); }
    .dir.down  { bottom: 0; left: 50%; transform: translateX(-50%); }
    .dir.left  { left: 0; top: 50%; transform: translateY(-50%); }
    .dir.right { right: 0; top: 50%; transform: translateY(-50%); }
    .ok {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: calc(var(--u) * 5.6);
      height: calc(var(--u) * 5.6);
      border-radius: 50%;
      border: none;
      cursor: pointer;
      touch-action: none;
      font-family: inherit;
      font-weight: bold;
      font-size: calc(var(--u) * 1.7);
      color: #d8dee8;
      background: linear-gradient(#5a6375, #333a46);
      box-shadow: 0 calc(var(--u) * 0.4) 0 #12151a;
    }
    .ok.pressed, .ok:active { filter: brightness(1.4); color: #00ff88; }

    /* Number keypad */
    .keypad {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: calc(var(--u) * 1.2) calc(var(--u) * 1.6);
      padding: 0 calc(var(--u) * 1);
    }
    .keypad .key {
      height: calc(var(--u) * 4.6);
      font-size: calc(var(--u) * 2.4);
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: calc(var(--u) * 0.6);
    }
    .keypad .key small { font-size: calc(var(--u) * 1.2); color: #8c96a5; }

    .hint {
      position: fixed;
      bottom: 6px;
      width: 100%;
      text-align: center;
      font-size: 11px;
      color: #555;
    }
    @media (max-width: 600px) { .hint { display: none; } }
  </style>
</head>
<body>
  <div class="phone">
    <div class="speaker"></div>
    <div class="brand">LINICRO</div>

    <div class="screen-wrap">
      <div class="screen">
        <div id="game-container"></div>
        <div class="softbar"><span id="soft-left"></span><span id="soft-right"></span></div>
      </div>
    </div>

    <div class="controls">
      <div class="side">
        <button class="key soft" data-key="softLeft" aria-label="Left soft key">―</button>
        <button class="key call" data-key="ok" aria-label="Call / OK">✆</button>
      </div>
      <div class="dpad">
        <button class="dir up" data-key="up" aria-label="Up">▲</button>
        <button class="dir left" data-key="left" aria-label="Left">◀</button>
        <button class="dir right" data-key="right" aria-label="Right">▶</button>
        <button class="dir down" data-key="down" aria-label="Down">▼</button>
        <button class="ok" data-key="ok" aria-label="OK">OK</button>
      </div>
      <div class="side">
        <button class="key soft" data-key="softRight" aria-label="Right soft key">―</button>
        <button class="key end" data-key="back" aria-label="Back">C</button>
      </div>
    </div>

    <div class="keypad">
      <button class="key" data-key="d1" data-digit="1">1<small>.,</small></button>
      <button class="key" data-key="d2" data-digit="2">2<small>abc</small></button>
      <button class="key" data-key="d3" data-digit="3">3<small>def</small></button>
      <button class="key" data-key="d4" data-digit="4">4<small>ghi</small></button>
      <button class="key" data-key="d5" data-digit="5">5<small>jkl</small></button>
      <button class="key" data-key="d6" data-digit="6">6<small>mno</small></button>
      <button class="key" data-key="d7" data-digit="7">7<small>pqrs</small></button>
      <button class="key" data-key="d8" data-digit="8">8<small>tuv</small></button>
      <button class="key" data-key="d9" data-digit="9">9<small>wxyz</small></button>
      <button class="key" data-key="star" data-digit="*">*</button>
      <button class="key" data-key="d0" data-digit="0">0<small>␣</small></button>
      <button class="key" data-key="hash" data-digit="#">#</button>
    </div>
  </div>

  <div class="hint">Keyboard: arrows/WASD move · Enter/Space OK · Q / E soft keys · Esc back · 0-9 keypad</div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
